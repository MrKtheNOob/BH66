[project]
name = "sewing"
version = "0.1.0"
description = "Inference prototype for AI-assisted tailoring measurements"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudinary>=1.44.1",
    "django>=5.2.0",
    "django-cors-headers>=4.7.0",
    "django-cloudinary-storage>=0.3.0",
    "email-validator>=2.2.0",
    "mediapipe>=0.10.14",
    "django-ninja>=1.4.0",
    "opencv-python>=4.10.0.84",
    "pillow>=11.2.1",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["lab/src", "backend"]
testpaths = ["lab/tests"]
